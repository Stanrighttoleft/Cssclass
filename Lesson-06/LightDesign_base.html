  //設定元件閃爍特效
  //effectFadeTo(哪一個物件,特效時間,透明度起始,透明度結束)
  function effectFadeTo(targetElement,duration,from,to){
    //淡化透明度的值
    $(targetElement).fadeTo(duration/2,from);
    $(targetElement).fadeTo(duration/2,to);
  }

  //$(function(){})網頁載入完成後,即進入功能函數內執行
  $(function(){
    $(".photolist img").on({
      mouseover:function(){effectFadeTo(this,1000,0.1,1);}
    });
    $('#contentMain').magnificPopup({delegate: 'a', type: 'image', gallery:{ enabled:true } });
  })
</script>
